version: '3.8'

networks:
  devops-network:
    driver: bridge

volumes:
  postgres-data:

services:

  postgres:
    image: postgres:15
    container_name: devops-postgres
    environment:
      POSTGRES_DB: devops_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - devops-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      target: production
    container_name: devops-api
    ports:
      - "5000:5000"
    environment:
      DB_HOST: postgres
      DB_NAME: devops_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    networks:
      - devops-network
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./worker
      target: production
    container_name: devops-worker
    environment:
      DB_HOST: postgres
      DB_NAME: devops_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    networks:
      - devops-network
    depends_on:
      postgres:
        condition: service_healthy
